[project]
name = "trendlens"
version = "0.1.0"
description = "TrendLens backend data pipeline — trending topic aggregation"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2,socks]>=0.28",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "jieba>=0.42",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "click>=8.1",
    "apscheduler>=3.10,<4",
    "tenacity>=9.0",
    "structlog>=24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trendlens"]
